[package]
name = "vire"
license = "GPL-3.0-or-later"
edition = "2021"
version = "0.1.0"

[[bin]]
name = "vire"
path = "src/main.rs"

[dependencies]
fastllvm-ir = { path = "../ir" }
fastllvm-solver = { path = "../solver" }
# The LLVM backend is used ONLY by the `vire` binary (main.rs, the paused
# execution oracle behind `vire run`), never by the library (frontend:
# parse→infer→lower). It is OPTIONAL behind the default `native` feature so
# the frontend builds without it.
fastllvm-backend = { path = "../backend", optional = true }

[features]
# `native` = the full compiler binary (LLVM oracle backend for `vire run`).
# Off → frontend-only (lex/parse/infer/lower/check + `--emit=gab`).
default = ["native"]
native = ["dep:fastllvm-backend"]

[lints]
workspace = true
