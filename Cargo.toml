[workspace]
resolver = "2"
default-members = ["crates/vire"]
members = [
    "crates/vire",    # Vire front-end (lexer/parser/AST → SSA IR) + driver binary
    "crates/ir",      # Vire-only SSA IR (lowering target)
    "crates/solver",  # whole-program ownership/escape/bounds solver
    "crates/backend", # Gabbro source emission (target) + LLVM execution oracle (paused)
    # The runtime C source that vire embeds for the LLVM oracle lives at
    # crates/runtime/ (data file, not a crate).
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.94"
license = "GPL-3.0-or-later"
authors = ["Vire contributors"]
repository = "https://example.invalid/vire"
description = "Vire language toolchain (Vire→Gabbro compiler with LLVM execution oracle)."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
